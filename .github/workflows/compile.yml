name: compile

# The installer on GitHub Pages is hand-published, so a sketch that does not
# build must never reach main. This compiles the same way a release is built:
# sketch, src/ and config.h copied to a clean directory, ESP32-S3 with OPI PSRAM
# and the huge_app partition layout.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sketch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "lvgl@8.3.11"
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "bb_captouch"
          arduino-cli lib install "GFX Library for Arduino"

      # lv_conf.h has to sit one level above the lvgl/ folder, which is where
      # arduino-cli's library directory puts it.
      - name: Install lv_conf.h
        run: cp lv_conf.h "$HOME/Arduino/libraries/lv_conf.h"

      - name: Compile
        run: |
          mkdir -p /tmp/sketch
          cp -r TickerTouch.ino src config.h lv_conf.h /tmp/sketch/
          arduino-cli compile \
            -b "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=4M,PartitionScheme=huge_app,CDCOnBoot=cdc,CPUFreq=240" \
            --warnings default \
            /tmp/sketch
